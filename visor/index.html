<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Mapa del equipo · equipo-dbs</title>
<style>
  :root { --tinta: #1d2140; --borde: #3a2a1a; --camino: #ecc994; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: stretch;
    font: 14px/1.3 ui-rounded, system-ui, sans-serif; color: var(--tinta);
    background: url(/fondos/desierto.jpg) center / cover, #eaa055;
  }
  main {
    position: relative; flex: 1; display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); grid-template-rows: repeat(3, 300px);
    gap: 34px; padding: 34px; max-width: 1400px; margin: 0 auto; align-content: start;
    /* Caminos de arena clara que unen las salas con la plaza de Hit. */
    background:
      linear-gradient(transparent calc(50% - 16px), var(--camino) calc(50% - 16px) calc(50% + 16px), transparent calc(50% + 16px)),
      linear-gradient(90deg, transparent calc(50% - 16px), var(--camino) calc(50% - 16px) calc(50% + 16px), transparent calc(50% + 16px));
  }
  .sala {
    position: relative; z-index: 1; display: flex; flex-direction: column; border: 4px solid var(--borde); border-radius: 6px;
    background: #fff; box-shadow: 0 6px 0 #0003; overflow: hidden;
  }
  .sala header {
    display: flex; gap: 6px; align-items: baseline; padding: 5px 8px; background: #1f2b6bee; color: #fff;
    font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sala header small { font-weight: 500; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
  .sala header .punto { width: 8px; height: 8px; border-radius: 50%; background: #8a8fa8; flex: none; align-self: center; }
  .sala[data-estado="trabaja"] header .punto { background: #7dff6b; box-shadow: 0 0 6px #7dff6b; }
  .sala[data-estado="falló"] header .punto { background: #ff5a4e; }
  /* Ilustración de la sala (visor/fondos/sala-<rol>.jpg); los personajes se paran abajo, en la puerta. */
  .suelo {
    flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 6px; padding: 8px 8px 14px;
    background: var(--fondo) 50% 30% / cover;
  }
  .avatar { image-rendering: pixelated; position: relative; z-index: 1; width: 72px; height: 72px; filter: drop-shadow(0 4px 0 #0004); }
  .sala[data-estado="libre"] .avatar, .sala[data-estado="terminó"] .avatar { opacity: .9; }
  .sala[data-estado="trabaja"] .avatar { animation: salto .9s steps(2) infinite; }
  .sala[data-aura="SSJ"] .avatar { filter: drop-shadow(0 0 6px #f2c230) drop-shadow(0 0 12px #f2c230); }
  .sala[data-aura="SSJ Blue"] .avatar { filter: drop-shadow(0 0 6px #3fb6f0) drop-shadow(0 0 12px #3fb6f0); }
  /* Personajes con hoja de sprites (visor/sprites): el cuadro lo mueve mapa.js con background-position. */
  .pj { position: relative; z-index: 1; flex: none; background-repeat: no-repeat; image-rendering: pixelated; filter: drop-shadow(0 3px 0 #0004); }
  .sala[data-aura="SSJ"] .pj { filter: drop-shadow(0 0 4px #f2c230) drop-shadow(0 0 10px #f2c23088); }
  .sala[data-aura="SSJ Blue"] .pj { filter: drop-shadow(0 0 4px #3fb6f0) drop-shadow(0 0 10px #3fb6f088); }
  #capa { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  #capa .pj { position: absolute; left: 0; top: 0; }
  @keyframes salto { 50% { transform: translateY(-5px); } }
  .globo {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: max-content; z-index: 2; max-width: 92%; padding: 5px 9px; border: 2px solid var(--tinta); border-radius: 10px;
    background: #fff; font-size: 12px; font-weight: 600; text-align: center; box-shadow: 0 3px 0 #0003;
  }
  .globo:empty { display: none; }
  .estado { padding: 5px 8px; background: #fffffff2; font-size: 12px; min-height: 2.6em; }
  .estado b { color: var(--color); }
  .sala[data-estado="falló"] .estado b { color: #c8321e; }
  .ssj { font-weight: 800; }
  .plaza {
    position: relative; z-index: 1; grid-column: 2 / 4; grid-row: 2; display: grid; place-items: center; text-align: center;
    background: url(/fondos/plaza.png) center / contain no-repeat;
  }
  .plaza .avatar { width: 80px; height: 80px; }
  .plaza .pj { margin: 0 auto; }
  .plaza p { margin: 6px 0 0; color: #fff; font-weight: 700; text-shadow: 0 2px 0 #0008; }
  /* Costa a la derecha (visor/fondos/costa.jpg, con la isla de Roshi) y debajo el feed «En vivo». */
  .mar {
    flex: none; width: 360px; padding: 34px 20px; display: flex; flex-direction: column; gap: 24px;
    background: url(/fondos/costa.jpg) 0 0 / 100% auto repeat-y, #2ab0bb;
  }
  /* Alto de la isla en la ilustración: el letrero queda bajo la casa y el feed empieza después. */
  .isla { position: relative; height: 640px; }
  .isla span {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); padding: 2px 8px; border-radius: 6px;
    background: #1f2b6bee; color: #fff; font-weight: 700; font-size: 12px; white-space: nowrap;
  }
  #vivo { max-height: 60vh; overflow: auto; padding: 10px 12px; background: #141833ee; color: #e8eaf6; border-radius: 8px; font-size: 12px; }
  #vivo h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; color: #7dff6b; }
  #vivo ol { list-style: none; margin: 0; padding: 0; }
  #vivo li { padding: 5px 0 5px 8px; border-left: 3px solid var(--color, #888); margin-bottom: 4px; }
  #vivo li span { display: block; opacity: .7; }
  #vivo li time { float: right; opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .sala[data-estado="trabaja"] .avatar { animation: none; } }
</style>
</head>
<body>
<main id="mapa" aria-label="Mapa del equipo">
  <section class="plaza" id="whis">
    <div><img class="avatar" alt="Hit"><p id="resumen">Conectando…</p></div>
  </section>
</main>
<div class="mar">
  <div class="isla" aria-hidden="true"><span>Kame House</span></div>
  <aside id="vivo" aria-live="polite"><h2>● EN VIVO</h2><ol id="feed"></ol></aside>
</div>
<script src="/mapa.js"></script>
</body>
</html>
