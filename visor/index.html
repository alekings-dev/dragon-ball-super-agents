<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Mapa del equipo · equipo-dbs</title>
<style>
  :root { --arena: #d9a35f; --arena-2: #c98f4c; --tinta: #1d2140; --borde: #3a2a1a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font: 14px/1.3 ui-rounded, system-ui, sans-serif; color: var(--tinta);
    background: radial-gradient(circle at 20% 30%, var(--arena-2) 0 2px, transparent 3px) 0 0 / 46px 46px, var(--arena);
  }
  body { display: flex; align-items: flex-start; }
  main {
    flex: 1; display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); grid-template-rows: repeat(3, 250px);
    gap: 28px; padding: 28px; max-width: 1400px; margin: 0 auto;
  }
  .sala {
    position: relative; display: flex; flex-direction: column; border: 4px solid var(--borde); border-radius: 6px;
    background: var(--suelo, #eee); box-shadow: 0 6px 0 #0003; overflow: hidden;
  }
  .sala header {
    display: flex; gap: 6px; align-items: baseline; padding: 5px 8px; background: #1f2b6bdd; color: #fff;
    font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sala header small { font-weight: 500; opacity: .8; overflow: hidden; text-overflow: ellipsis; }
  .sala header .punto { width: 8px; height: 8px; border-radius: 50%; background: #8a8fa8; flex: none; align-self: center; }
  .sala[data-estado="trabaja"] header .punto { background: #7dff6b; box-shadow: 0 0 6px #7dff6b; }
  .sala[data-estado="falló"] header .punto { background: #ff5a4e; }
  /* Suelo de baldosas hecho con gradientes, teñido con el color del personaje. */
  .suelo {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px;
    background:
      linear-gradient(90deg, #0001 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(#0001 1px, transparent 1px) 0 0 / 24px 24px,
      color-mix(in srgb, var(--color) 22%, #fff8ec);
  }
  .avatar { width: 72px; height: 72px; image-rendering: pixelated; filter: drop-shadow(0 4px 0 #0004); }
  .sala[data-estado="libre"] .avatar, .sala[data-estado="terminó"] .avatar { opacity: .85; }
  .sala[data-estado="trabaja"] .avatar { animation: salto .9s steps(2) infinite; }
  .sala[data-aura="SSJ"] .avatar { filter: drop-shadow(0 0 6px #f2c230) drop-shadow(0 0 12px #f2c230); }
  .sala[data-aura="SSJ Blue"] .avatar { filter: drop-shadow(0 0 6px #3fb6f0) drop-shadow(0 0 12px #3fb6f0); }
  @keyframes salto { 50% { transform: translateY(-5px); } }
  .globo {
    max-width: 92%;
    padding: 5px 9px; border: 2px solid var(--tinta); border-radius: 10px; background: #fff; font-size: 12px; font-weight: 600;
    text-align: center; box-shadow: 0 3px 0 #0003;
  }
  .globo:empty { display: none; }
  .estado { padding: 5px 8px; background: #fffc; font-size: 12px; min-height: 2.6em; }
  .estado b { color: var(--color); }
  .sala[data-estado="falló"] .estado b { color: #c8321e; }
  .ssj { font-weight: 800; }
  .plaza {
    grid-column: 2 / 4; grid-row: 2; display: grid; place-items: center; text-align: center; border-radius: 50%;
    background: radial-gradient(circle closest-side, #1d5a6a 0 62%, #123a46 63% 98%, transparent 100%);
  }
  .plaza .avatar { width: 88px; height: 88px; }
  .plaza p { margin: 6px 0 0; color: #fff; font-weight: 700; text-shadow: 0 2px 0 #0008; }
  #vivo {
    position: sticky; top: 28px; flex: none; width: 320px; max-height: calc(100vh - 56px); overflow: auto; margin: 28px 28px 28px 0; padding: 10px 12px;
    background: #141833ee; color: #e8eaf6; border-radius: 8px; font-size: 12px;
  }
  #vivo h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; color: #7dff6b; }
  #vivo ol { list-style: none; margin: 0; padding: 0; }
  #vivo li { padding: 5px 0 5px 8px; border-left: 3px solid var(--color, #888); margin-bottom: 4px; }
  #vivo li span { display: block; opacity: .7; }
  #vivo li time { float: right; opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .sala[data-estado="trabaja"] .avatar { animation: none; } }
</style>
</head>
<body>
<main id="mapa" aria-label="Mapa del equipo">
  <section class="plaza" id="whis">
    <div><img class="avatar" alt="Whis"><p id="resumen">Conectando…</p></div>
  </section>
</main>
<aside id="vivo" aria-live="polite"><h2>● EN VIVO</h2><ol id="feed"></ol></aside>
<script src="/mapa.js"></script>
</body>
</html>
